# NSheep Configuration
# Copy to cfg.yaml and edit

server:
  bindAddr: "127.0.0.1"
  port: 8080

github:
  token: ""  # Optional: GitHub API token for higher rate limits

local:
  dbPath: "./data/nsheep.db"      # SQLite database path
  tarballDir: "./data/tarballs"   # Directory for package tarballs

cloudflare:
  accountId: ""
  r2AccessKeyId: ""
  r2SecretKey: ""
  r2Bucket: "nsheep-packages"
  kvNamespaceId: ""
  apiToken: ""

fetcher:
  interval: 3600        # Seconds between fetch cycles (default: 1 hour)
  maxPackages: 0        # Max packages per cycle (0 = unlimited)
  filterPatterns: []    # Only fetch packages matching these patterns (empty = all)

validator:
  enabled: true         # Enable Docker validation
  dockerImage: "nimlang/nim:latest"  # Docker image for building
  timeout: 300          # Build timeout in seconds (5 minutes)
  required: false       # If true, packages that fail validation won't be stored

# Which storage backend to use: "local" or "cloudflare"
storage: local
