name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: '2.2.x'

      - name: Cache Nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Build release binaries
        run: nimble build -d:release -d:strip

      - name: Build frontend
        run: nim js -d:release -o:public/app.js frontend/app.nim

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Deploy binaries and static files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_HOST $(ssh-keyscan -H $SSH_HOST 2>/dev/null | grep -oE 'ssh-ed25519 [^ ]+')" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -o StrictHostKeyChecking=accept-new nsheep nsheep-fetcher $SSH_USER@$SSH_HOST:/opt/nsheep/
          scp -r -o StrictHostKeyChecking=accept-new public/* $SSH_USER@$SSH_HOST:/opt/nsheep/public/

      - name: Restart services
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST "
            cd /opt/nsheep
            chmod +x nsheep nsheep-fetcher
            sudo rc-service nsheep restart
            sudo rc-service nsheep-fetcher restart
            sleep 2
            sudo rc-service nsheep status || exit 1
            sudo rc-service nsheep-fetcher status || exit 1
          "
