version: '3.8'

services:
  nsheep:
    build: .
    container_name: nsheep
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./cfg.yaml:/app/cfg.yaml:ro
    restart: unless-stopped
    command: /app/nsheep /app/cfg.yaml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  fetcher:
    build: .
    container_name: nsheep-fetcher
    volumes:
      - ./data:/app/data
      - ./cfg.yaml:/app/cfg.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # For Docker validation
    restart: unless-stopped
    command: /app/nsheep-fetcher /app/cfg.yaml
    depends_on:
      - nsheep

volumes:
  data:
