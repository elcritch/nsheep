server {
    server_name nimpack.org;
    client_max_body_size 100M;

    root /opt/nsheep/public;

    # Static assets — served directly by nginx with long cache
    location = /app.js {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Type "application/javascript";
        try_files /app.js =404;
    }

    location = /app.css {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Type "text/css";
        try_files /app.css =404;
    }

    location = /robot.svg {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Type "image/svg+xml";
        try_files /robot.svg =404;
    }

    location = /llm.txt {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type "text/plain; charset=utf-8";
        try_files /llm.txt =404;
    }

    # SPA shell — revalidate on every load, serve 304 when unchanged
    location = / {
        add_header Cache-Control "max-age=0, must-revalidate";
        add_header Content-Type "text/html";
        try_files /index.html =404;
    }

    # API + everything else → Mummy backend
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/nimpack.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nimpack.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://nimpack.org$request_uri;
}

server {
    listen 80;
    server_name nimpack.org;
    return 301 https://$host$request_uri;
}
