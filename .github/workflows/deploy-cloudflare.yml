name: Deploy (Cloudflare)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy-tunnel:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: alaviss/setup-nim@0.1.1
        with:
          path: 'nim'
          version: 'version-2-2'

      - name: Cache Nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Build release binaries
        run: nimble build -d:release -d:strip

      - name: Upload to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nsheep,config.json"
          target: "/opt/nsheep/"
          strip_components: 0

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/nsheep
            chmod +x nsheep
            sudo systemctl restart nsheep || sudo docker-compose restart nsheep

      - name: Health check
        run: |
          sleep 5
          curl -sf https://${{ secrets.DOMAIN }}/health || exit 1

  update-cloudflare-config:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Update Cloudflare Tunnel config (if needed)
        run: |
          # 这里可以添加更新 tunnel ingress 规则的逻辑
          echo "Tunnel config is managed locally via cloudflared"

  purge-cache:
    runs-on: ubuntu-latest
    needs: deploy-tunnel
    steps:
      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' || true
