name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: '2.2.x'

      - name: Cache Nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: ${{ runner.os }}-nimble-${{ hashFiles('*.nimble') }}
          restore-keys: |
            ${{ runner.os }}-nimble-

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Build release binaries
        run: nimble build -d:release -d:strip

      - name: Build frontend
        run: nim js -d:release -o:public/app.js frontend/app.nim

      - name: Upload binaries
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "nsheep,nsheep-fetcher"
          target: "/opt/nsheep/"
          strip_components: 0
          debug: true

      - name: Upload static files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "public/*"
          target: "/opt/nsheep/public/"
          strip_components: 1

      - name: Restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/nsheep
            chmod +x nsheep nsheep-fetcher
            sudo rc-service nsheep restart
            sudo rc-service nsheep-fetcher restart
            sleep 2
            sudo rc-service nsheep status || exit 1
            sudo rc-service nsheep-fetcher status || exit 1
